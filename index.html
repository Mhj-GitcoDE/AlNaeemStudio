<style>
:root{color-scheme:only light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--beige:#E8DCC8;--sand:#D5C5AD;--gold:#C49A45;--deep:#80551E;--ink:#1F2A24;--emerald:#0F4D3A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#F4ECDD 0%,var(--beige) 45%,var(--sand) 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:rgba(255,252,246,.82);border:1px solid rgba(128,85,30,.22);border-radius:10px;padding:34px 26px 26px;box-shadow:0 18px 50px -24px rgba(80,55,20,.45);text-align:center}
.mark{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(145deg,#F7D98A,var(--gold) 55%,var(--deep));box-shadow:inset 0 1px 2px rgba(255,255,255,.6)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:25px;margin:0 0 4px;letter-spacing:.01em}
p.sub{margin:0 0 22px;font-size:13px;color:#6B5E48;letter-spacing:.04em}
form{display:flex;flex-direction:column;gap:12px;text-align:left}
input[type=password]{width:100%;font-size:17px;padding:13px 14px;border:1px solid #BBA886;border-radius:6px;background:#fff;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--gold);outline-offset:1px}
label.rem{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4E4433}
input[type=checkbox]{accent-color:var(--emerald);width:17px;height:17px}
button{font-size:16px;font-weight:600;padding:13px;border:0;border-radius:6px;background:var(--emerald);color:#F4ECDD;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.3em;margin:4px 0 0;font-size:13px;color:#9A3B1E;text-align:center}
.foot{margin-top:18px;font-size:11.5px;color:#8A7C63;letter-spacing:.05em}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true"></div>
  <h1>Al Naeem Name Studio</h1>
  <p class="sub">Private studio. Enter the password to open.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="Al Naeem" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <button id="go" type="submit">Open studio</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <div class="foot">Al Naeem Jewellery · Dubai Gold Souk</div>
</main>

  if (!window.crypto || !crypto.subtle) { $('msg').textContent = 'This browser cannot open the studio. Use Safari or Chrome over https.'; $('go').disabled = true; return; }
  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function(base){ return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.it}, base, 256); })
      .then(function(bits){ return new Uint8Array(bits); });
  }
  function unlock(raw){
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, k, b64(P.ct)); })
      .then(function(pt){
        var html = new TextDecoder().decode(pt);
        // only swap once this page has completely finished loading; swapping earlier makes some
        // browsers (Chrome on Android) paste the studio into this page instead of replacing it
        return new Promise(function(done){
          var swap = function(){ setTimeout(function(){ document.open(); document.write(html); document.close(); done(); }, 0); };
          if (document.readyState === 'complete') swap(); else window.addEventListener('load', swap, {once:true});
        });
      });
  }
  // a phone that has opened it before goes straight in
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(b64(saved)).catch(function(){ try { localStorage.removeItem(KEY); } catch (e) {} });
  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('go').textContent = 'Opening…'; $('msg').textContent = '';
    var remember = $('rem').checked;
    derive(pw).then(function(raw){
      // check the password first, save it, then open (opening replaces this page)
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
        .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, k, b64(P.ct)); })
        .then(function(){ if (remember) try { localStorage.setItem(KEY, tob64(raw)); } catch (e) {} return unlock(raw); });
    }).catch(function(){
      $('go').disabled = false; $('go').textContent = 'Open studio';
      $('msg').textContent = 'That password is not right. Please try again.'; $('pw').select();
    });
  });
})();
</script>
